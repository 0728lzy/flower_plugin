<p><strong><span style="font-size: 12pt;">一、允许后台高耗电时运行</span></strong></p>
<p><span style="font-size: 12pt;">1、打开系统【设置】</span></p>
<p><span style="font-size: 12pt;">2、点击【电池】</span></p>
<p><span style="font-size: 12pt;">3、点击后台耗电管理或后台高耗电</span></p>
<p><span style="font-size: 12pt;">4、找到GG手游加速器，打开允许后台高耗电开关，完成设置</span></p>
<p>&nbsp;</p>
<p><strong><span style="font-size: 12pt;">二、允许自启动</span></strong></p>
<p><span style="font-size: 12pt;">1、打开系统【设置】</span></p>
<p><span style="font-size: 12pt;">2、点击应用与权限或更多设置</span></p>
<p><span style="font-size: 12pt;">3、点击【权限管理】</span></p>
<p><span style="font-size: 12pt;">4、切换至【权限】页面，打开【自启动】</span></p>
<p><span style="font-size: 12pt;">5、打开GG手游加速器自启动开关，完成设置</span></p>
<p>&nbsp;</p>
<p><strong><span style="font-size: 12pt;">三、进程上锁</span></strong></p>
