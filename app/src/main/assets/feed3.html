<!DOCTYPE html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>收不到短信验证码</title>
</head>
<p>
    <span style="font-size: 12pt;">
        <strong>1、手机欠费或者空号手机欠费的情况会导致手机无法正常收发短信哦，请检查您的手机账户余额是否充足，请检查您的手机号是否正常运作当中，手机号码为空号的用户也是无法收发短信的</strong>
    </span>
    <br/>
    <br/>
    <span style="font-size: 12pt;">
        <strong>2、软件屏蔽</strong>
    </span>
    <br/>
    <span style="font-size: 12pt;">打开手机里安全软件，暂时关闭拦截功能，然后再次尝试获取验证码</span>
    <br/>
    <br/>
    <span style="font-size: 12pt;">
        <strong>3、短信网关拥堵</strong>
    </span>
    <br/>
    <span style="font-size: 12pt;">短信网关拥堵会出现短信延时或者丢失的情况，建议过一段时间再进行尝试。</span>
    <br/>
    <br/>
    <span style="font-size: 12pt;">
        <strong>4、手机自身问题</strong>
    </span>
    <br/>
    <span style="font-size: 12pt;">由于手机本身功能不正常，可能会导致无法接收短信，建议重启手机试试。</span>
</p>
