<p><span style="font-size: 12pt;"><strong>1、部分android设备系统升级后，不识别游戏GG内可加速游戏为0个的问题。因为设备系统升级后，回收了GG手游的&lsquo;读取应用列表&rsquo;的权限。</strong></span><br /><span style="font-size: 12pt;">在手机系统-设置内，给予GG手游加速器读取应用列表权限后，重启GG手游加速器即可</span></p>
