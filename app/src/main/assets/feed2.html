    <title>注销账号的相关问题</title>
</head>
<p><span style="font-size: 12pt;"><strong>1、GG手游加速器支持注销账号吗？</strong></span><br /><span style="font-size: 12pt;">GG手游加速器支持账号注销。</span></p>
<p><span style="font-size: 12pt;"><strong>2、如何注销账号？</strong></span><br /><span style="font-size: 12pt;">登录GG手游加速器APP，依次点击&ldquo;我的-设置-注销帐号&rdquo;，按照提示操作自助注销即可。</span></p>
<p><span style="font-size: 12pt;"><strong>3、注销账号后会怎么样？</strong></span><br /><span style="font-size: 12pt;">A：在您确认了注销账号后，我们会清空您账号的一切权益和记录。</span></p>
<p><span style="font-size: 12pt;"><strong>4、如果我注销后后悔了怎么办？权益还能找回来吗？</strong></span><br /><span style="font-size: 12pt;">不能，注销经过您的确认后我们会进行数据清空，如果再次登录，您的账号就属于无记录的新账号。请谨慎考虑注销行为。</span></p>
